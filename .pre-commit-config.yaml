repos:
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
    -   id: clang-format
        types_or: [c++, inc]
-   repo: local
    hooks:
    # -   id: copyright-year-checker
    #     name: copyright-year-checker
    #     entry: script/check_copyright_year.sh
    #     verbose: false
    #     language: script
    #     types: [c++]
    -   id: remove-exec-bit
        name: Remove executable bit from non-executable files
        entry: script/remove_exec_bit.sh
        language: script
        types_or: [c++, text]
        verbose: true
    -   id: ruff-check
        name: Ruff Linter
        entry: ruff check --fix
        language: python
        types: [python]
        additional_dependencies: [ruff]
        exclude: |
            (?x)^(
                docs/conf.py
            )$
    -   id: ruff-format
        name: Ruff Formatter
        entry: ruff format
        language: python
        types: [python]
        additional_dependencies: [ruff]
        exclude: |
            (?x)^(
                docs/conf.py
            )$
    -   id: run-remod-if-ck-tile-changed
        name: Run remod.py if ck_tile files changed
        entry: script/remod_for_ck_tile.sh
        language: script
        always_run: true
        pass_filenames: false
