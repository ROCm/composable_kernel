    <text x="200" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#FFF">K: 0 → 511 (single CU processes all)</text>
    
    <!-- Split K dimension -->
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="12" fill="#666">Stream-K: Split into 4 slices of 128 elements each</text>
